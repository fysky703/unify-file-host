<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNiFY File Host</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06070a;--panel:#111318;--panel-soft:#181a20;--panel-hover:#20232b;
  --line:rgba(255,255,255,.12);--line-bright:rgba(255,255,255,.28);
  --text:#fff;--muted:#9b9da5;--silver:#f3f3f3;--danger:#ff7777;
  --radius:22px;--shadow:0 24px 70px rgba(0,0,0,.52);--glow:0 0 28px rgba(255,255,255,.08)
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;padding:0 22px 72px;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;background:
  radial-gradient(900px 420px at 50% -140px,rgba(255,255,255,.16),transparent 68%),
  radial-gradient(600px 500px at 100% 50%,rgba(255,255,255,.035),transparent 70%),var(--bg)
}
button,a,label{font:inherit}
.site-shell{width:min(1180px,100%);margin:auto}
.topbar{
  height:82px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);margin-bottom:42px
}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:20px;font-weight:900;letter-spacing:.14em}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;color:#080808;background:linear-gradient(145deg,#fff 8%,#777);box-shadow:0 0 28px rgba(255,255,255,.2)}
.main-nav{display:flex;align-items:center;gap:8px}
.main-nav a{padding:11px 16px;border:1px solid transparent;border-radius:11px;color:#9799a1;text-decoration:none;font-size:13px;font-weight:700;transition:.2s}
.main-nav a:hover,.main-nav a.active{color:#080808;background:#fff;box-shadow:0 8px 24px rgba(255,255,255,.12)}
.page-grid{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(340px,.84fr);gap:24px;align-items:start}
.card,.cloud-panel{
  width:100%;border:1px solid var(--line-bright);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(29,31,37,.96),rgba(10,11,14,.97));
  box-shadow:var(--shadow),var(--glow)
}
.card{padding:34px}.cloud-panel{padding:27px}
.header{margin-bottom:28px}.header h1{font-size:31px;line-height:1.1;letter-spacing:-.8px;color:#fff;background:linear-gradient(110deg,#fff,#92949b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{margin-top:9px;color:var(--muted);font-size:13px}
.drop{min-height:245px;width:100%;display:flex;align-items:center;justify-content:center;padding:28px 20px;text-align:center;cursor:pointer;border:1px dashed rgba(255,255,255,.34);border-radius:18px;background:rgba(255,255,255,.025);transition:.25s}
.drop:hover,.drop.drag{border-color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 34px rgba(255,255,255,.04),0 0 30px rgba(255,255,255,.09)}
.drop-icon{font-size:46px;margin-bottom:15px;filter:grayscale(1)}.drop-label{font-size:16px;font-weight:800}.drop-hint{margin-top:8px;color:#85878f;font-size:12px}input[type=file]{display:none}
.queue{display:flex;flex-direction:column;gap:10px;margin-top:20px}.queue:empty{display:none}
.q-item,.cloud-item{position:relative;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:linear-gradient(145deg,#1b1d23,#111216);transition:.2s}
.q-item{padding:13px 14px;border-radius:15px;overflow:hidden}.q-item:hover,.cloud-item:hover{border-color:#777;box-shadow:var(--glow)}
.q-item.done{border-color:rgba(255,255,255,.34)}.q-item.errored{border-color:rgba(255,119,119,.42)}
.q-thumb{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:#0b0c0f;font-size:24px}.q-thumb img,.q-thumb video{width:100%;height:100%;display:block;object-fit:cover}
.q-info,.cloud-info{min-width:0;flex:1}.q-name,.cloud-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.q-meta,.cloud-meta{margin-top:4px;color:#888b94;font-size:11px}
.q-badge{flex-shrink:0;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800;white-space:nowrap}.badge-ready,.badge-uploading{background:#292c34;color:#b4b6bd}.badge-done{background:#eee;color:#111}.badge-error{background:rgba(255,80,80,.14);color:#ff9d9d}
.q-del,.q-copy,.cloud-open,.cloud-delete{display:flex;align-items:center;justify-content:center;border:1px solid var(--line-bright);border-radius:9px;background:transparent;color:#c6c8ce;cursor:pointer;transition:.18s}.q-del{width:31px;height:31px;flex-shrink:0;padding:0;font-size:14px}.q-del:hover,.cloud-delete:hover{border-color:var(--danger);color:var(--danger);background:rgba(255,90,90,.08)}.q-del:disabled{opacity:.3;cursor:not-allowed}
.q-prog{display:none;position:absolute;right:0;bottom:0;left:0;height:3px;background:rgba(255,255,255,.08)}.q-bar{height:100%;width:0;background:linear-gradient(90deg,#fff,#777);transition:width .12s linear}.q-item.uploading .q-prog{display:block}
.q-url-row{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}.q-url{min-width:0;flex:1;padding:6px 9px;overflow:hidden;border-radius:8px;background:#090a0d;color:#bcbec4;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.q-copy{width:auto!important;min-height:unset!important;margin-top:0!important;padding:6px 10px;font-size:10px}.q-copy:hover{color:#080808;background:#fff}
.actions{display:flex;align-items:center;gap:10px;margin-top:20px}.btn-primary,.btn-clear{min-height:50px;border-radius:13px;cursor:pointer;font-weight:800;transition:.2s}.btn-primary{flex:1;border:0;color:#080808;background:linear-gradient(135deg,#fff,#888);box-shadow:0 12px 28px rgba(255,255,255,.11)}.btn-primary:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}.btn-primary:disabled{opacity:.4;cursor:not-allowed}.btn-clear{padding:0 20px;border:1px solid var(--line-bright);color:#c9cbd0;background:transparent}.btn-clear:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-heading h2{font-size:19px}.panel-heading p{margin-top:6px;color:#8c8e96;font-size:12px}.cloud-count{padding:6px 10px;border:1px solid #555;border-radius:99px;color:#ddd;font-size:11px;white-space:nowrap}.cloud-list{display:flex;flex-direction:column;gap:9px;max-height:540px;overflow:auto}.cloud-empty{padding:40px 12px;text-align:center;color:#777;border:1px dashed #444;border-radius:14px;font-size:13px}.cloud-item{padding:12px;border-radius:14px}.cloud-icon{width:39px;height:39px;display:grid;place-items:center;flex-shrink:0;border-radius:10px;background:#292b30;font-size:18px;filter:grayscale(1)}.cloud-open,.cloud-delete{width:auto;padding:7px 10px;font-size:11px;text-decoration:none}.cloud-open:hover{color:#080808;background:#fff}.danger-button{width:100%;margin-top:14px;padding:11px 12px;border:1px solid #754848;border-radius:10px;color:#ffb0b0;background:rgba(120,20,20,.18);cursor:pointer;font-size:11px}.danger-button:hover{background:rgba(180,30,30,.3)}
.error{display:none;margin-top:14px;padding:12px 14px;border:1px solid rgba(255,119,119,.35);border-radius:12px;color:#ffb0b0;background:rgba(120,20,20,.18);font-size:13px}.error.show{display:block}.footer{margin-top:26px;text-align:center;color:#666a73;font-size:11px}
.preview-modal{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px)}.preview-modal.open{display:flex}.preview-inner{position:relative;display:flex;align-items:center;justify-content:center;max-width:min(860px,100%);max-height:90vh;overflow:hidden;border-radius:18px;background:#101114;box-shadow:0 40px 100px #000}.preview-inner img,.preview-inner video,.preview-inner audio{display:block;max-width:100%;max-height:85vh;object-fit:contain}.preview-inner audio{min-width:280px;padding:30px}.preview-close{position:absolute;top:12px;right:12px;z-index:10;width:34px!important;height:34px;min-height:unset!important;margin-top:0!important;border:1px solid var(--line-bright);border-radius:50%;color:#fff;background:rgba(0,0,0,.65);cursor:pointer;font-size:18px;line-height:1}.preview-close:hover{background:rgba(255,80,80,.3)}
@media(max-width:850px){.page-grid{grid-template-columns:1fr}.topbar{margin-bottom:24px}.cloud-list{max-height:none}}
@media(max-width:560px){body{padding:0 10px 48px}.topbar{height:70px}.brand{font-size:16px;letter-spacing:.1em}.brand-mark{width:35px;height:35px}.main-nav a{padding:8px 9px;font-size:11px}.card,.cloud-panel{padding:20px;border-radius:18px}.header h1{font-size:25px}.drop{min-height:190px}.q-item,.cloud-item{gap:8px}.q-thumb{width:44px;height:44px}.q-badge{display:none}.actions{flex-direction:column}.btn-primary,.btn-clear{width:100%}.cloud-open,.cloud-delete{padding:7px 8px;font-size:10px}}

/* Poster card layout */
.queue,.cloud-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-height:none}
.q-item,.cloud-item{min-width:0;min-height:280px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;padding:14px;border-radius:18px;overflow:hidden}
.q-thumb{width:100%;height:150px;flex-shrink:0;border-radius:13px;font-size:42px;background:linear-gradient(145deg,#272a31,#0d0e11)}
.q-info,.cloud-info{width:100%;flex:none}
.q-name,.cloud-name{font-size:14px;line-height:1.35}
.q-meta,.cloud-meta{line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-badge{align-self:flex-start}
.q-del{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.q-url-row{margin-top:auto}
.cloud-icon{width:100%;height:150px;flex-shrink:0;border-radius:13px;font-size:52px;background:linear-gradient(145deg,#272a31,#0d0e11)}
.cloud-open,.cloud-delete{flex:1;min-height:36px}
.cloud-item:has(.cloud-open){padding-bottom:12px}
.cloud-item .cloud-open,.cloud-item .cloud-delete{margin-top:auto}
.cloud-item{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto}
.cloud-item .cloud-icon{grid-column:1 / -1;grid-row:1}
.cloud-item .cloud-info{grid-column:1 / -1;grid-row:2}
.cloud-item .cloud-open{grid-column:1;grid-row:4}
.cloud-item .cloud-delete{grid-column:2;grid-row:4}

@media(max-width:850px){.page-grid{grid-template-columns:1fr}.queue,.cloud-list{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
@media(max-width:480px){.queue,.cloud-list{grid-template-columns:1fr;gap:12px}.q-item,.cloud-item{min-height:260px}.q-thumb,.cloud-icon{height:180px}.topbar{gap:10px}.main-nav{gap:3px}.main-nav a{padding:8px 7px}.header h1{font-size:23px}}

/* Media poster enhancements */
.q-thumb,.cloud-visual{position:relative}
.media-play{position:absolute;top:50%;left:50%;width:48px;height:48px;display:grid;place-items:center;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.75);border-radius:50%;color:#111;background:rgba(255,255,255,.92);font-size:20px;box-shadow:0 8px 24px #0008;pointer-events:none}
.waveform{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:4px;padding:20px;background:radial-gradient(circle at 50% 45%,#555,transparent 65%),linear-gradient(145deg,#2c2e36,#0b0c10)}
.waveform i{width:4px;border-radius:99px;background:linear-gradient(#fff,#777);animation:wave 1.1s ease-in-out infinite alternate}
.waveform i:nth-child(2n){animation-delay:-.25s}.waveform i:nth-child(3n){animation-delay:-.5s}
@keyframes wave{from{height:18%}to{height:78%}}
.genre-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.genre-tab{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:#999da7;background:#111318;cursor:pointer;font-size:11px;font-weight:800}
.genre-tab.active,.genre-tab:hover{color:#080808;background:#fff;border-color:#fff}
.genre-hidden{display:none!important}
.cloud-visual{width:100%;height:150px;overflow:hidden;border-radius:13px;background:linear-gradient(145deg,#272a31,#0d0e11)}
.cloud-visual img,.cloud-visual video{width:100%;height:100%;display:block;object-fit:cover}
.cloud-visual .waveform{height:100%}.cloud-visual .media-play{width:44px;height:44px}
.cloud-actions{display:flex;grid-column:1 / -1;gap:6px;grid-row:4}
.cloud-copy{flex:1;min-height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-bright);border-radius:9px;color:#c6c8ce;background:transparent;cursor:pointer;font-size:11px}
.cloud-copy:hover{color:#080808;background:#fff}
.q-thumb img,.q-thumb video,.cloud-visual img,.cloud-visual video{width:100%;height:100%;display:block;object-fit:contain;object-position:center;background:#090a0d}
.q-name-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:#fff;background:#090a0d;outline:none;font-size:13px}
.q-name-input:focus{border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.12)}
@media(max-width:480px){
  .queue,.cloud-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .q-item,.cloud-item{min-height:246px;padding:10px;border-radius:15px;gap:9px}
  .q-thumb,.cloud-visual,.cloud-icon{height:126px;border-radius:10px}
  .q-name,.cloud-name{font-size:12px}.q-meta,.cloud-meta{font-size:9px}
  .q-del{top:8px;right:8px;width:27px;height:27px}
  .q-url{font-size:8px;padding:5px}.q-copy{padding:5px 6px;font-size:9px}
  .cloud-open,.cloud-delete,.cloud-copy{min-height:30px;padding:6px 4px;font-size:9px}
}
</style>
</head>

<body>
<div class="site-shell">
  <header class="topbar">
    <a class="brand" href="#upload"><span class="brand-mark">U</span><span>UNiFY</span></a>
    <nav class="main-nav" aria-label="Main menu"><a class="active" href="#upload">Upload</a><a href="#library">R2 Library</a></nav>
  </header>

<!-- Full preview modal -->
<div class="preview-modal" id="previewModal" role="dialog" aria-modal="true">
  <div class="preview-inner" id="previewInner"></div>
  <button class="preview-close" id="previewClose" title="បិទ">✕</button>
</div>

<main class="page-grid" id="upload">
<section class="card">

  <div class="header">
    <h1>UNiFY File Host</h1>
    <p>Upload ឯកសារទៅ Cloudflare R2 · Max 500 MB ក្នុងមួយឯកសារ</p><div class="genre-tabs" id="genreTabs"><button class="genre-tab active" data-genre="all">All</button><button class="genre-tab" data-genre="image">Images</button><button class="genre-tab" data-genre="video">Videos</button><button class="genre-tab" data-genre="audio">Music</button><button class="genre-tab" data-genre="other">Files</button></div>
  </div>

  <!-- Drop zone -->
  <label class="drop" id="drop">
    <input id="fileInput" type="file" multiple>
    <div>
      <div class="drop-icon">☁️</div>
      <div class="drop-label">ចុច ឬ ទាញ​ឯកសារ​មកទីនេះ</div>
      <div class="drop-hint">រូបភាព · វីដេអូ · អូឌីយ៉ូ · PDF · ZIP · Code · Max 500 MB</div>
    </div>
  </label>

  <!-- File queue -->
  <div class="queue" id="queue"></div>

  <!-- Action buttons -->
  <div class="actions" id="actions" style="display:none">
    <button class="btn-primary" id="uploadBtn">⬆ Upload ឯកសារ</button>
    <button class="btn-clear" id="clearAllBtn">🗑 លុបទាំងអស់</button>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="footer">Powered by UNiFY CODE · Cloudflare R2</div>
</section>

<section class="cloud-panel" id="library">
  <div class="panel-heading">
    <div><h2>R2 Cloud Library</h2><p>ឯកសារដែលរក្សាទុកក្នុង Cloudflare R2</p></div>
    <span class="cloud-count" id="cloudCount">0 files</span>
  </div>
  <div class="cloud-list" id="cloudList"><div class="cloud-empty">កំពុងផ្ទុកឯកសារ...</div></div>
  <button class="danger-button" id="deleteAllCloudBtn" style="display:none;margin-top:14px;width:100%">🗑 លុបឯកសារទាំងអស់ពី R2</button>
</section>
</main>
</div>

<script>
// ────────────────────────────────────────────
// State
// ────────────────────────────────────────────
const MAX_SIZE = 500 * 1024 * 1024;
let files = []; // [{id, file, status, url, barEl, badgeEl, itemEl}]
let nextId = 0;
let uploading = false;

// ────────────────────────────────────────────
// DOM refs
// ────────────────────────────────────────────
const fileInput    = document.getElementById("fileInput");
const drop         = document.getElementById("drop");
const queue        = document.getElementById("queue");
const actions      = document.getElementById("actions");
const uploadBtn    = document.getElementById("uploadBtn");
const clearAllBtn  = document.getElementById("clearAllBtn");
const errorBox     = document.getElementById("errorBox");
const previewModal = document.getElementById("previewModal");
const previewInner = document.getElementById("previewInner");
const previewClose = document.getElementById("previewClose");

// ────────────────────────────────────────────
// Helpers
// ────────────────────────────────────────────
function fmtSize(b){
  if(b < 1024) return b + " B";
  const u=["KB","MB","GB"]; let s=b/1024,i=0;
  while(s>=1024&&i<u.length-1){s/=1024;i++}
  return s.toFixed(s>=100?0:2)+" "+u[i];
}

function mimeCategory(file){
  const t = file.type;
  if(t.startsWith("image/")) return "image";
  if(t.startsWith("video/")) return "video";
  if(t.startsWith("audio/")) return "audio";
  if(t === "application/pdf") return "pdf";
  return "other";
}

function categoryFromName(name, type=""){
  if(type.startsWith("image/") || /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(name)) return "image";
  if(type.startsWith("video/") || /\.(mp4|mov|avi|mkv|webm|m4v)$/i.test(name)) return "video";
  if(type.startsWith("audio/") || /\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(name)) return "audio";
  return "other";
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function waveformHtml(){return `<div class="waveform" aria-label="Audio waveform">${Array.from({length:24},(_,i)=>`<i style="height:${22+(i*17)%62}%"></i>`).join("")}</div>`;}
function fileIcon(file){
  const c = mimeCategory(file);
  if(c==="image") return "🖼️";
  if(c==="video") return "🎬";
  if(c==="audio") return "🎵";
  if(c==="pdf")   return "📄";
  const ext = file.name.split(".").pop().toLowerCase();
  const map={zip:"🗜️",rar:"🗜️",gz:"🗜️",tar:"🗜️",
             js:"📝",ts:"📝",py:"📝",html:"📝",css:"📝",json:"📝",
             mp3:"🎵",wav:"🎵",ogg:"🎵",
             mp4:"🎬",mov:"🎬",avi:"🎬",mkv:"🎬"};
  return map[ext] || "📁";
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add("show");
  setTimeout(()=>errorBox.classList.remove("show"), 5000);
}

function syncActions(){
  const hasFiles = files.length > 0;
  const pendingCount = files.filter(f=>f.status==="ready").length;
  actions.style.display = hasFiles ? "flex" : "none";
  uploadBtn.disabled = uploading || pendingCount === 0;
  uploadBtn.textContent =
    pendingCount > 0
      ? `⬆ Upload ${pendingCount} ឯកសារ`
      : "⬆ Upload ឯកសារ";
}

// ────────────────────────────────────────────
// Build thumbnail (returns promise of element)
// ────────────────────────────────────────────
function buildThumb(file, onclick){
  const wrap = document.createElement("div");
  wrap.className = "q-thumb";
  wrap.title = "ចុចដើម្បីព្យាបាលជាបណ្ដោះអាសន្ន";
  wrap.style.cursor = "pointer";
  const cat = mimeCategory(file);

  if(cat === "image"){
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.alt = file.name;
    wrap.appendChild(img);
    wrap.addEventListener("click", onclick);
  } else if(cat === "video"){
    const vid = document.createElement("video");
    vid.src = URL.createObjectURL(file);
    vid.muted = true;
    vid.preload = "metadata";
    vid.addEventListener("loadedmetadata",()=>{vid.currentTime=1});
    wrap.appendChild(vid);
    const play = document.createElement("span");
    play.className = "media-play";
    play.textContent = "▶";
    wrap.appendChild(play);
    wrap.addEventListener("click", onclick);
  } else if(cat === "audio"){
    wrap.innerHTML = waveformHtml();
    wrap.addEventListener("click", onclick);
  } else {
    wrap.textContent = fileIcon(file);
    wrap.style.cursor = "default";
  }
  return wrap;
}

// ────────────────────────────────────────────
// Open full preview modal
// ────────────────────────────────────────────
function openPreview(file){
  previewInner.innerHTML="";
  const cat = mimeCategory(file);
  let el;
  if(cat==="image"){
    el = document.createElement("img");
    el.src = URL.createObjectURL(file);
    el.alt = file.name;
  } else if(cat==="video"){
    el = document.createElement("video");
    el.src = URL.createObjectURL(file);
    el.controls = true;
    el.autoplay = true;
  } else if(cat==="audio"){
    el = document.createElement("audio");
    el.src = URL.createObjectURL(file);
    el.controls = true;
    el.autoplay = true;
  } else {
    // No visual preview – just show info
    const info = document.createElement("div");
    info.style.cssText="padding:40px;text-align:center;color:#8898bb";
    info.innerHTML=`<div style="font-size:52px;margin-bottom:14px">${fileIcon(file)}</div>
      <div style="font-weight:700;font-size:15px;margin-bottom:6px">${file.name}</div>
      <div style="font-size:12px">${fmtSize(file.size)}</div>`;
    previewInner.appendChild(info);
    previewModal.classList.add("open");
    return;
  }
  previewInner.appendChild(el);
  previewModal.classList.add("open");
}

previewClose.addEventListener("click", closePreview);
previewModal.addEventListener("click", e=>{
  if(e.target===previewModal) closePreview();
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closePreview();
});
function closePreview(){
  previewModal.classList.remove("open");
  previewInner.querySelectorAll("video,audio").forEach(m=>{m.pause();m.src=""});
  previewInner.innerHTML="";
}

function openRemotePreview(url, category, name=""){
  previewInner.innerHTML="";
  let el;
  if(category === "image"){
    el = document.createElement("img");
    el.src = url;
    el.alt = name;
  } else if(category === "video"){
    el = document.createElement("video");
    el.src = url;
    el.controls = true;
    el.autoplay = true;
  } else if(category === "audio"){
    el = document.createElement("audio");
    el.src = url;
    el.controls = true;
    el.autoplay = true;
  } else return;
  previewInner.appendChild(el);
  previewModal.classList.add("open");
}

// ────────────────────────────────────────────
// Add files to queue
// ────────────────────────────────────────────
function addFiles(newFiles){
  for(const file of newFiles){
    if(file.size > MAX_SIZE){
      showError(`"${file.name}" ធំលើស 500 MB – រំលង`);
      continue;
    }
    // Avoid duplicate (same name+size)
    if(files.find(f=>f.file.name===file.name&&f.file.size===file.size)) continue;

    const id = nextId++;
    const entry = {id, file, status:"ready", url:null,
                   barEl:null, badgeEl:null, itemEl:null};
    files.push(entry);
    renderQueueItem(entry);
  }
  syncActions();
}

function renderQueueItem(entry){
  const {id, file} = entry;

  const item = document.createElement("div");
  item.className = "q-item";
  item.dataset.id = id;
  item.dataset.genre = categoryFromName(file.name, file.type);
  entry.itemEl = item;

  // Thumbnail
  const thumb = buildThumb(file, ()=>openPreview(file));
  item.appendChild(thumb);

  // Info column
  const info = document.createElement("div");
  info.className = "q-info";

  const name = document.createElement("input");
  name.className = "q-name-input";
  name.type = "text";
  name.value = file.name;
  name.setAttribute("aria-label", "Rename file before upload");
  entry.nameInput = name;

  const meta = document.createElement("div");
  meta.className = "q-meta";
  meta.textContent = fmtSize(file.size) + " · " + (file.type || "unknown");

  // URL row (hidden until done)
  const urlRow = document.createElement("div");
  urlRow.className = "q-url-row";
  urlRow.style.display = "none";
  entry.urlRow = urlRow;

  const urlEl = document.createElement("div");
  urlEl.className = "q-url";
  entry.urlEl = urlEl;

  const copyBtn = document.createElement("button");
  copyBtn.className = "q-copy";
  copyBtn.textContent = "Copy URL";
  copyBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    try{
      await navigator.clipboard.writeText(urlEl.textContent);
      copyBtn.textContent = "Copied ✓";
      setTimeout(()=>{copyBtn.textContent="Copy URL"},1500);
    }catch{showError("មិនអាច Copy URL បានទេ")}
  });

  urlRow.appendChild(urlEl);
  urlRow.appendChild(copyBtn);

  info.appendChild(name);
  info.appendChild(meta);
  info.appendChild(urlRow);
  item.appendChild(info);

  // Badge
  const badge = document.createElement("span");
  badge.className = "q-badge badge-ready";
  badge.textContent = "រង់ចាំ";
  entry.badgeEl = badge;
  item.appendChild(badge);

  // Delete button
  const del = document.createElement("button");
  del.className = "q-del";
  del.title = "លុបចេញ";
  del.textContent = "✕";
  del.setAttribute("aria-label","លុបចេញ");
  del.addEventListener("click", e=>{
    e.preventDefault();e.stopPropagation();
    removeEntry(id);
  });
  entry.delBtn = del;
  item.appendChild(del);

  // Progress bar (bottom strip)
  const prog = document.createElement("div");
  prog.className = "q-prog";
  const bar = document.createElement("div");
  bar.className = "q-bar";
  prog.appendChild(bar);
  entry.barEl = bar;
  item.appendChild(prog);

  queue.appendChild(item);

  // Animate in
  requestAnimationFrame(()=>{
    item.style.opacity="0";item.style.transform="translateY(8px)";
    requestAnimationFrame(()=>{
      item.style.transition="opacity .2s,transform .2s";
      item.style.opacity="1";item.style.transform="";
    });
  });
}

// ────────────────────────────────────────────
// Remove entry
// ────────────────────────────────────────────
function removeEntry(id){
  const idx = files.findIndex(f=>f.id===id);
  if(idx===-1) return;
  const entry = files[idx];
  if(entry.status==="uploading") return; // don't remove mid-upload
  entry.itemEl.style.transition="opacity .18s,transform .18s,max-height .22s";
  entry.itemEl.style.opacity="0";
  entry.itemEl.style.transform="translateX(12px)";
  entry.itemEl.style.maxHeight="0";
  entry.itemEl.style.overflow="hidden";
  setTimeout(()=>{entry.itemEl.remove()},220);
  files.splice(idx,1);
  syncActions();
}

// ────────────────────────────────────────────
// Clear all (only non-uploading)
// ────────────────────────────────────────────
clearAllBtn.addEventListener("click",()=>{
  const removable = files.filter(f=>f.status!=="uploading").map(f=>f.id);
  removable.forEach(id=>removeEntry(id));
});

// ────────────────────────────────────────────
// Drop / file input
// ────────────────────────────────────────────
fileInput.addEventListener("change",()=>{
  addFiles(Array.from(fileInput.files));
  fileInput.value="";
});

drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag")});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{
  e.preventDefault();drop.classList.remove("drag");
  addFiles(Array.from(e.dataTransfer.files));
});

// ────────────────────────────────────────────
// Upload all pending
// ────────────────────────────────────────────
uploadBtn.addEventListener("click", startUpload);

async function startUpload(){
  const pending = files.filter(f=>f.status==="ready");
  if(!pending.length || uploading) return;
  uploading = true;
  syncActions();

  for(const entry of pending){
    await uploadEntry(entry);
  }

  uploading = false;
  syncActions();
}

async function uploadEntry(entry){
  const {file} = entry;
  setStatus(entry,"uploading");

  try{
    // 1. Get signed URL
    const r = await fetch("/api/upload-url",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        fileName: (entry.nameInput?.value || file.name).trim() || file.name,
        contentType: file.type || "application/octet-stream",
        fileSize: file.size
      })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Could not create upload URL.");

    // 2. PUT to R2 with progress
    await putToR2(data.uploadUrl, file, entry);

    // 3. Done
    entry.url = data.publicUrl;
    entry.urlEl.textContent = data.publicUrl;
    entry.urlRow.style.display = "flex";
    setStatus(entry,"done");
    loadCloudFiles();

  }catch(err){
    console.error(err);
    setStatus(entry,"error", err.message);
  }
}

function setStatus(entry, status, errMsg=""){
  entry.status = status;
  const {badgeEl, itemEl, barEl, delBtn} = entry;

  itemEl.classList.remove("done","errored","uploading");
  badgeEl.className = "q-badge";

  if(status==="uploading"){
    itemEl.classList.add("uploading");
    badgeEl.classList.add("badge-uploading");
    badgeEl.textContent = "Uploading…";
    delBtn.disabled = true;
  } else if(status==="done"){
    itemEl.classList.add("done");
    badgeEl.classList.add("badge-done");
    badgeEl.textContent = "✓ Done";
    delBtn.disabled = false;
  } else if(status==="error"){
    itemEl.classList.add("errored");
    badgeEl.classList.add("badge-error");
    badgeEl.textContent = "✗ Error";
    delBtn.disabled = false;
    const meta = entry.itemEl.querySelector(".q-meta");
    if(meta && errMsg) meta.textContent = errMsg;
  } else {
    badgeEl.classList.add("badge-ready");
    badgeEl.textContent = "រង់ចាំ";
    delBtn.disabled = false;
  }

  if(barEl) barEl.style.width = status==="done" ? "100%" : "0%";
}

function renderCloudCard(file){
  const category = categoryFromName(file.name);
  const safeName = escapeHtml(file.name);
  let visual = category === "image"
    ? `<img src="${file.url}" alt="${safeName}" loading="lazy">`
    : category === "video"
      ? `<video src="${file.url}" muted preload="metadata"></video><span class="media-play">▶</span>`
      : category === "audio" ? waveformHtml() : `<div class="cloud-icon">📄</div>`;
  return `<article class="cloud-item" data-key="${encodeURIComponent(file.key)}" data-genre="${category}" data-preview-url="${escapeHtml(file.url)}" data-preview-category="${category}" data-preview-name="${safeName}"><div class="cloud-visual">${visual}</div><div class="cloud-info"><div class="cloud-name" title="${safeName}">${safeName}</div><div class="cloud-meta">${fmtSize(file.size || 0)} · ${new Date(file.lastModified).toLocaleString()}</div></div><div class="cloud-actions"><a class="cloud-open" href="${file.url}" target="_blank" rel="noopener">Open</a><button class="cloud-copy" data-copy-url="${escapeHtml(file.url)}">⧉ Copy</button><button class="cloud-delete" data-delete-key="${encodeURIComponent(file.key)}">Delete</button></div></article>`;
}
async function copyUrl(url, button){
  try{await navigator.clipboard.writeText(url);const old=button.textContent;button.textContent="✓ Copied";setTimeout(()=>button.textContent=old,1400)}
  catch{showError("មិនអាច Copy URL បានទេ")}
}
function applyGenreFilter(){
  const active=document.querySelector(".genre-tab.active")?.dataset.genre || "all";
  document.querySelectorAll("[data-genre]").forEach(el=>{if(!el.classList.contains("genre-tab"))el.classList.toggle("genre-hidden",active!=="all"&&el.dataset.genre!==active)});
}
document.querySelectorAll(".genre-tab").forEach(tab=>tab.addEventListener("click",()=>{document.querySelectorAll(".genre-tab").forEach(t=>t.classList.remove("active"));tab.classList.add("active");applyGenreFilter()}));

async function loadCloudFiles(){
  const list = document.getElementById("cloudList");
  const count = document.getElementById("cloudCount");
  const deleteAll = document.getElementById("deleteAllCloudBtn");
  try{
    const response = await fetch("/api/files");
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Could not load files.");
    count.textContent = `${data.files.length} files`;
    deleteAll.style.display = data.files.length ? "block" : "none";
    if(!data.files.length){list.innerHTML='<div class="cloud-empty">មិនទាន់មានឯកសារនៅក្នុង R2 ទេ</div>';return;}
    list.innerHTML = data.files.map(renderCloudCard).join("");
    list.querySelectorAll("[data-delete-key]").forEach(button=>button.addEventListener("click",()=>deleteCloudFile(decodeURIComponent(button.dataset.deleteKey),button)));
    list.querySelectorAll("[data-copy-url]").forEach(button=>button.addEventListener("click",()=>copyUrl(button.dataset.copyUrl,button)));
    list.querySelectorAll(".cloud-visual").forEach(visual=>visual.addEventListener("click",()=>{
      const card = visual.closest(".cloud-item");
      openRemotePreview(card.dataset.previewUrl, card.dataset.previewCategory, card.dataset.previewName);
    }));
    applyGenreFilter();
  }catch(error){list.innerHTML=`<div class="cloud-empty">${error.message}</div>`;}
}

async function deleteCloudFile(key, button){
  if(!confirm("លុបឯកសារនេះពី R2 មែនទេ?")) return;
  button.disabled = true;
  try{
    const response = await fetch("/api/delete-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})});
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Delete failed.");
    await loadCloudFiles();
  }catch(error){showError(error.message);button.disabled=false;}
}

document.getElementById("deleteAllCloudBtn").addEventListener("click",async()=>{
  if(!confirm("លុបឯកសារទាំងអស់ពី R2 មែនទេ? សកម្មភាពនេះមិនអាចត្រឡប់វិញបានទេ។")) return;
  try{
    const response = await fetch("/api/delete-all",{method:"POST"});
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Delete failed.");
    await loadCloudFiles();
  }catch(error){showError(error.message);}
});

loadCloudFiles();

function putToR2(url, file, entry){
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", url);
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.addEventListener("progress",e=>{
      if(e.lengthComputable && entry.barEl){
        entry.barEl.style.width = Math.round(e.loaded/e.total*100)+"%";
      }
    });
    xhr.addEventListener("load",()=>{
      xhr.status>=200&&xhr.status<300 ? resolve() :
        reject(new Error("R2 upload failed ("+xhr.status+"). Check CORS settings."));
    });
    xhr.addEventListener("error",()=>reject(new Error("Network error during upload.")));
    xhr.addEventListener("abort",()=>reject(new Error("Upload cancelled.")));
    xhr.send(file);
  });
}
</script>
