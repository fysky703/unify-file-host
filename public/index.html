<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNiFY File Host</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07090d;
  --card:#111520;
  --card2:#151b27;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.13);
  --accent:#7c8cff;
  --green:#00e676;
  --red:#ff5252;
  --text:#e4e8f0;
  --muted:#6b7587;
  --radius:20px;
}

body{
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:32px 16px 60px;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse 80% 40% at 50% -10%,#1a1f3a 0%,transparent 60%),
    #07090d;
  color:var(--text);
  font-size:14px;
}

/* ── CARD ── */
.card{
  width:min(740px,100%);
  padding:32px;
  border:1px solid var(--border2);
  border-radius:28px;
  background:rgba(17,21,32,.9);
  backdrop-filter:blur(28px);
  box-shadow:0 40px 90px rgba(0,0,0,.55);
}

/* ── HEADER ── */
.header{margin-bottom:28px}
.header h1{
  font-size:26px;font-weight:800;letter-spacing:-.6px;
  background:linear-gradient(120deg,#fff 40%,#7c8cff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header p{margin-top:6px;color:var(--muted);font-size:13px}

/* ── DROP ZONE ── */
.drop{
  position:relative;
  width:100%;min-height:180px;
  display:flex;align-items:center;justify-content:center;
  border:2px dashed #2e3a50;
  border-radius:var(--radius);
  padding:28px 20px;text-align:center;cursor:pointer;
  transition:.2s ease;
}
.drop:hover,.drop.drag{
  border-color:var(--accent);
  background:rgba(124,140,255,.06);
}
.drop-icon{font-size:40px;margin-bottom:8px}
.drop-label{font-weight:700;font-size:15px}
.drop-hint{margin-top:6px;color:var(--muted);font-size:12px}
input[type=file]{display:none}

/* ── QUEUE ── */
.queue{
  display:none;margin-top:20px;
  display:flex;flex-direction:column;gap:10px;
}
.queue:empty{display:none}

.q-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border-radius:14px;
  background:var(--card2);
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  transition:.2s;
}
.q-item.done{border-color:rgba(0,230,118,.25);background:rgba(0,230,118,.04)}
.q-item.errored{border-color:rgba(255,82,82,.25);background:rgba(255,82,82,.04)}

/* Preview thumbnail */
.q-thumb{
  flex-shrink:0;
  width:52px;height:52px;
  border-radius:10px;
  background:#0d1118;
  border:1px solid var(--border);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.q-thumb img,.q-thumb video{
  width:100%;height:100%;object-fit:cover;display:block;
}

/* Info */
.q-info{flex:1;min-width:0}
.q-name{
  font-weight:700;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.q-meta{margin-top:3px;color:var(--muted);font-size:11px}

/* Progress inside item */
.q-prog{
  display:none;
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--border);
}
.q-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),var(--green));
  transition:width .12s linear;
}
.q-item.uploading .q-prog{display:block}

/* Status badge */
.q-badge{
  flex-shrink:0;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:99px;
  white-space:nowrap;
}
.badge-ready{background:#1e2535;color:#8898bb}
.badge-uploading{background:#1e2535;color:var(--accent)}
.badge-done{background:rgba(0,230,118,.12);color:var(--green)}
.badge-error{background:rgba(255,82,82,.12);color:var(--red)}

/* Delete btn */
.q-del{
  flex-shrink:0;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:8px;
  background:transparent;color:var(--muted);
  cursor:pointer;font-size:15px;transition:.15s;
  line-height:1;
  margin-top:0 !important;min-height:unset !important;
  padding:0 !important;
}
.q-del:hover{border-color:var(--red);color:var(--red);background:rgba(255,82,82,.08)}
.q-del:disabled{opacity:.3;cursor:not-allowed}

/* Result URL inside item */
.q-url-row{
  display:none;margin-top:6px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.q-url{
  flex:1;min-width:0;
  color:#7ee8ae;font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#0b0e14;padding:5px 10px;border-radius:8px;
}
.q-copy{
  flex-shrink:0;font-size:11px;padding:5px 12px;
  background:#1e2535;color:#8898bb;border:1px solid var(--border);
  border-radius:8px;cursor:pointer;white-space:nowrap;
  margin-top:0 !important;min-height:unset !important;
  width:auto !important;
}
.q-copy:hover{border-color:var(--accent);color:var(--accent)}

/* ── FULL PREVIEW MODAL ── */
.preview-modal{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(5,7,12,.88);
  backdrop-filter:blur(12px);
  align-items:center;justify-content:center;
  padding:20px;
}
.preview-modal.open{display:flex}
.preview-inner{
  position:relative;max-width:min(860px,100%);max-height:90vh;
  border-radius:18px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.7);
  background:#0d1018;
  display:flex;align-items:center;justify-content:center;
}
.preview-inner img,.preview-inner video,.preview-inner audio{
  display:block;max-width:100%;max-height:85vh;object-fit:contain;
}
.preview-inner audio{padding:30px;min-width:280px}
.preview-close{
  position:absolute;top:12px;right:12px;
  width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1px solid var(--border2);
  color:#fff;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;transition:.15s;
  margin-top:0 !important;min-height:unset !important;
  width:34px !important;
}
.preview-close:hover{background:rgba(255,82,82,.3)}

/* ── ACTIONS BAR ── */
.actions{
  margin-top:20px;display:flex;gap:10px;align-items:center;
}
.btn-primary{
  flex:1;min-height:50px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#5a52e0,#00c853);
  color:#fff;font-size:14px;font-weight:800;cursor:pointer;
  transition:.15s;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-clear{
  min-height:50px;padding:0 20px;border-radius:14px;
  background:transparent;border:1px solid var(--border2);
  color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:.15s;
  width:auto;margin-top:0;
}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

/* ── GLOBAL ERROR ── */
.error{
  display:none;margin-top:14px;padding:12px 14px;
  border-radius:12px;background:rgba(255,82,82,.08);
  border:1px solid rgba(255,82,82,.22);color:#ff9d9d;font-size:13px;
}
.error.show{display:block}

/* ── FOOTER ── */
.footer{margin-top:24px;text-align:center;color:#3e4a5c;font-size:11px}

/* ── RESPONSIVE ── */
@media(max-width:520px){
  body{padding:16px 10px 50px}
  .card{padding:20px;border-radius:22px}
  .header h1{font-size:22px}
  .drop{min-height:160px}
  .q-thumb{width:44px;height:44px}
}
</style>
</head>

<body>

<!-- Full preview modal -->
<div class="preview-modal" id="previewModal" role="dialog" aria-modal="true">
  <div class="preview-inner" id="previewInner"></div>
  <button class="preview-close" id="previewClose" title="បិទ">✕</button>
</div>

<main class="card">

  <div class="header">
    <h1>UNiFY File Host</h1>
    <p>Upload ឯកសារទៅ Cloudflare R2 · Max 500 MB ក្នុងមួយឯកសារ</p>
  </div>

  <!-- Drop zone -->
  <label class="drop" id="drop">
    <input id="fileInput" type="file" multiple>
    <div>
      <div class="drop-icon">☁️</div>
      <div class="drop-label">ចុច ឬ ទាញ​ឯកសារ​មកទីនេះ</div>
      <div class="drop-hint">រូបភាព · វីដេអូ · អូឌីយ៉ូ · PDF · ZIP · Code · Max 500 MB</div>
    </div>
  </label>

  <!-- File queue -->
  <div class="queue" id="queue"></div>

  <!-- Action buttons -->
  <div class="actions" id="actions" style="display:none">
    <button class="btn-primary" id="uploadBtn">⬆ Upload ឯកសារ</button>
    <button class="btn-clear" id="clearAllBtn">🗑 លុបទាំងអស់</button>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="footer">Powered by UNiFY CODE · Cloudflare R2</div>

</main>

<script>
// ────────────────────────────────────────────
// State
// ────────────────────────────────────────────
const MAX_SIZE = 500 * 1024 * 1024;
let files = []; // [{id, file, status, url, barEl, badgeEl, itemEl}]
let nextId = 0;
let uploading = false;

// ────────────────────────────────────────────
// DOM refs
// ────────────────────────────────────────────
const fileInput    = document.getElementById("fileInput");
const drop         = document.getElementById("drop");
const queue        = document.getElementById("queue");
const actions      = document.getElementById("actions");
const uploadBtn    = document.getElementById("uploadBtn");
const clearAllBtn  = document.getElementById("clearAllBtn");
const errorBox     = document.getElementById("errorBox");
const previewModal = document.getElementById("previewModal");
const previewInner = document.getElementById("previewInner");
const previewClose = document.getElementById("previewClose");

// ────────────────────────────────────────────
// Helpers
// ────────────────────────────────────────────
function fmtSize(b){
  if(b < 1024) return b + " B";
  const u=["KB","MB","GB"]; let s=b/1024,i=0;
  while(s>=1024&&i<u.length-1){s/=1024;i++}
  return s.toFixed(s>=100?0:2)+" "+u[i];
}

function mimeCategory(file){
  const t = file.type;
  if(t.startsWith("image/")) return "image";
  if(t.startsWith("video/")) return "video";
  if(t.startsWith("audio/")) return "audio";
  if(t === "application/pdf") return "pdf";
  return "other";
}

function fileIcon(file){
  const c = mimeCategory(file);
  if(c==="image") return "🖼️";
  if(c==="video") return "🎬";
  if(c==="audio") return "🎵";
  if(c==="pdf")   return "📄";
  const ext = file.name.split(".").pop().toLowerCase();
  const map={zip:"🗜️",rar:"🗜️",gz:"🗜️",tar:"🗜️",
             js:"📝",ts:"📝",py:"📝",html:"📝",css:"📝",json:"📝",
             mp3:"🎵",wav:"🎵",ogg:"🎵",
             mp4:"🎬",mov:"🎬",avi:"🎬",mkv:"🎬"};
  return map[ext] || "📁";
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add("show");
  setTimeout(()=>errorBox.classList.remove("show"), 5000);
}

function syncActions(){
  const hasFiles = files.length > 0;
  const pendingCount = files.filter(f=>f.status==="ready").length;
  actions.style.display = hasFiles ? "flex" : "none";
  uploadBtn.disabled = uploading || pendingCount === 0;
  uploadBtn.textContent =
    pendingCount > 0
      ? `⬆ Upload ${pendingCount} ឯកសារ`
      : "⬆ Upload ឯកសារ";
}

// ────────────────────────────────────────────
// Build thumbnail (returns promise of element)
// ────────────────────────────────────────────
function buildThumb(file, onclick){
  const wrap = document.createElement("div");
  wrap.className = "q-thumb";
  wrap.title = "ចុចដើម្បីព្យាបាលជាបណ្ដោះអាសន្ន";
  wrap.style.cursor = "pointer";
  const cat = mimeCategory(file);

  if(cat === "image"){
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.alt = file.name;
    wrap.appendChild(img);
    wrap.addEventListener("click", onclick);
  } else if(cat === "video"){
    const vid = document.createElement("video");
    vid.src = URL.createObjectURL(file);
    vid.muted = true;
    vid.preload = "metadata";
    vid.addEventListener("loadedmetadata",()=>{vid.currentTime=1});
    wrap.appendChild(vid);
    wrap.addEventListener("click", onclick);
  } else {
    wrap.textContent = fileIcon(file);
    wrap.style.cursor = "default";
  }
  return wrap;
}

// ────────────────────────────────────────────
// Open full preview modal
// ────────────────────────────────────────────
function openPreview(file){
  previewInner.innerHTML="";
  const cat = mimeCategory(file);
  let el;
  if(cat==="image"){
    el = document.createElement("img");
    el.src = URL.createObjectURL(file);
    el.alt = file.name;
  } else if(cat==="video"){
    el = document.createElement("video");
    el.src = URL.createObjectURL(file);
    el.controls = true;
    el.autoplay = true;
  } else if(cat==="audio"){
    el = document.createElement("audio");
    el.src = URL.createObjectURL(file);
    el.controls = true;
    el.autoplay = true;
  } else {
    // No visual preview – just show info
    const info = document.createElement("div");
    info.style.cssText="padding:40px;text-align:center;color:#8898bb";
    info.innerHTML=`<div style="font-size:52px;margin-bottom:14px">${fileIcon(file)}</div>
      <div style="font-weight:700;font-size:15px;margin-bottom:6px">${file.name}</div>
      <div style="font-size:12px">${fmtSize(file.size)}</div>`;
    previewInner.appendChild(info);
    previewModal.classList.add("open");
    return;
  }
  previewInner.appendChild(el);
  previewModal.classList.add("open");
}

previewClose.addEventListener("click", closePreview);
previewModal.addEventListener("click", e=>{
  if(e.target===previewModal) closePreview();
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closePreview();
});
function closePreview(){
  previewModal.classList.remove("open");
  // Stop any playing media
  previewInner.querySelectorAll("video,audio").forEach(m=>{m.pause();m.src=""});
  previewInner.innerHTML="";
}

// ────────────────────────────────────────────
// Add files to queue
// ────────────────────────────────────────────
function addFiles(newFiles){
  for(const file of newFiles){
    if(file.size > MAX_SIZE){
      showError(`"${file.name}" ធំលើស 500 MB – រំលង`);
      continue;
    }
    // Avoid duplicate (same name+size)
    if(files.find(f=>f.file.name===file.name&&f.file.size===file.size)) continue;

    const id = nextId++;
    const entry = {id, file, status:"ready", url:null,
                   barEl:null, badgeEl:null, itemEl:null};
    files.push(entry);
    renderQueueItem(entry);
  }
  syncActions();
}

function renderQueueItem(entry){
  const {id, file} = entry;

  const item = document.createElement("div");
  item.className = "q-item";
  item.dataset.id = id;
  entry.itemEl = item;

  // Thumbnail
  const thumb = buildThumb(file, ()=>openPreview(file));
  item.appendChild(thumb);

  // Info column
  const info = document.createElement("div");
  info.className = "q-info";

  const name = document.createElement("div");
  name.className = "q-name";
  name.textContent = file.name;

  const meta = document.createElement("div");
  meta.className = "q-meta";
  meta.textContent = fmtSize(file.size) + " · " + (file.type || "unknown");

  // URL row (hidden until done)
  const urlRow = document.createElement("div");
  urlRow.className = "q-url-row";
  urlRow.style.display = "none";
  entry.urlRow = urlRow;

  const urlEl = document.createElement("div");
  urlEl.className = "q-url";
  entry.urlEl = urlEl;

  const copyBtn = document.createElement("button");
  copyBtn.className = "q-copy";
  copyBtn.textContent = "Copy URL";
  copyBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    try{
      await navigator.clipboard.writeText(urlEl.textContent);
      copyBtn.textContent = "Copied ✓";
      setTimeout(()=>{copyBtn.textContent="Copy URL"},1500);
    }catch{showError("មិនអាច Copy URL បានទេ")}
  });

  urlRow.appendChild(urlEl);
  urlRow.appendChild(copyBtn);

  info.appendChild(name);
  info.appendChild(meta);
  info.appendChild(urlRow);
  item.appendChild(info);

  // Badge
  const badge = document.createElement("span");
  badge.className = "q-badge badge-ready";
  badge.textContent = "រង់ចាំ";
  entry.badgeEl = badge;
  item.appendChild(badge);

  // Delete button
  const del = document.createElement("button");
  del.className = "q-del";
  del.title = "លុបចេញ";
  del.textContent = "✕";
  del.setAttribute("aria-label","លុបចេញ");
  del.addEventListener("click", e=>{
    e.preventDefault();e.stopPropagation();
    removeEntry(id);
  });
  entry.delBtn = del;
  item.appendChild(del);

  // Progress bar (bottom strip)
  const prog = document.createElement("div");
  prog.className = "q-prog";
  const bar = document.createElement("div");
  bar.className = "q-bar";
  prog.appendChild(bar);
  entry.barEl = bar;
  item.appendChild(prog);

  queue.appendChild(item);

  // Animate in
  requestAnimationFrame(()=>{
    item.style.opacity="0";item.style.transform="translateY(8px)";
    requestAnimationFrame(()=>{
      item.style.transition="opacity .2s,transform .2s";
      item.style.opacity="1";item.style.transform="";
    });
  });
}

// ────────────────────────────────────────────
// Remove entry
// ────────────────────────────────────────────
function removeEntry(id){
  const idx = files.findIndex(f=>f.id===id);
  if(idx===-1) return;
  const entry = files[idx];
  if(entry.status==="uploading") return; // don't remove mid-upload
  entry.itemEl.style.transition="opacity .18s,transform .18s,max-height .22s";
  entry.itemEl.style.opacity="0";
  entry.itemEl.style.transform="translateX(12px)";
  entry.itemEl.style.maxHeight="0";
  entry.itemEl.style.overflow="hidden";
  setTimeout(()=>{entry.itemEl.remove()},220);
  files.splice(idx,1);
  syncActions();
}

// ────────────────────────────────────────────
// Clear all (only non-uploading)
// ────────────────────────────────────────────
clearAllBtn.addEventListener("click",()=>{
  const removable = files.filter(f=>f.status!=="uploading").map(f=>f.id);
  removable.forEach(id=>removeEntry(id));
});

// ────────────────────────────────────────────
// Drop / file input
// ────────────────────────────────────────────
fileInput.addEventListener("change",()=>{
  addFiles(Array.from(fileInput.files));
  fileInput.value="";
});

drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag")});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{
  e.preventDefault();drop.classList.remove("drag");
  addFiles(Array.from(e.dataTransfer.files));
});

// ────────────────────────────────────────────
// Upload all pending
// ────────────────────────────────────────────
uploadBtn.addEventListener("click", startUpload);

async function startUpload(){
  const pending = files.filter(f=>f.status==="ready");
  if(!pending.length || uploading) return;
  uploading = true;
  syncActions();

  for(const entry of pending){
    await uploadEntry(entry);
  }

  uploading = false;
  syncActions();
}

async function uploadEntry(entry){
  const {file} = entry;
  setStatus(entry,"uploading");

  try{
    // 1. Get signed URL
    const r = await fetch("/api/upload-url",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        fileName: file.name,
        contentType: file.type || "application/octet-stream",
        fileSize: file.size
      })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Could not create upload URL.");

    // 2. PUT to R2 with progress
    await putToR2(data.uploadUrl, file, entry);

    // 3. Done
    entry.url = data.publicUrl;
    entry.urlEl.textContent = data.publicUrl;
    entry.urlRow.style.display = "flex";
    setStatus(entry,"done");

  }catch(err){
    console.error(err);
    setStatus(entry,"error", err.message);
  }
}

function setStatus(entry, status, errMsg=""){
  entry.status = status;
  const {badgeEl, itemEl, barEl, delBtn} = entry;

  itemEl.classList.remove("done","errored","uploading");
  badgeEl.className = "q-badge";

  if(status==="uploading"){
    itemEl.classList.add("uploading");
    badgeEl.classList.add("badge-uploading");
    badgeEl.textContent = "Uploading…";
    delBtn.disabled = true;
  } else if(status==="done"){
    itemEl.classList.add("done");
    badgeEl.classList.add("badge-done");
    badgeEl.textContent = "✓ Done";
    delBtn.disabled = false;
  } else if(status==="error"){
    itemEl.classList.add("errored");
    badgeEl.classList.add("badge-error");
    badgeEl.textContent = "✗ Error";
    delBtn.disabled = false;
    const meta = entry.itemEl.querySelector(".q-meta");
    if(meta && errMsg) meta.textContent = errMsg;
  } else {
    badgeEl.classList.add("badge-ready");
    badgeEl.textContent = "រង់ចាំ";
    delBtn.disabled = false;
  }

  if(barEl) barEl.style.width = status==="done" ? "100%" : "0%";
}

function putToR2(url, file, entry){
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", url);
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.addEventListener("progress",e=>{
      if(e.lengthComputable && entry.barEl){
        entry.barEl.style.width = Math.round(e.loaded/e.total*100)+"%";
      }
    });
    xhr.addEventListener("load",()=>{
      xhr.status>=200&&xhr.status<300 ? resolve() :
        reject(new Error("R2 upload failed ("+xhr.status+"). Check CORS settings."));
    });
    xhr.addEventListener("error",()=>reject(new Error("Network error during upload.")));
    xhr.addEventListener("abort",()=>reject(new Error("Upload cancelled.")));
    xhr.send(file);
  });
}
</script>
